<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Designing Workshop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="main">
            <h1 align="center">Multimedia Player</h1>
        </div>
        <div class="audio">
            <h3>Audio Section</h3>
            <audio src="song.mp3" controls></audio>
        </div>
        <div class="video">
            <h3>Video Section</h3>
            <video width="320" height="180" controls src="college.mp4"></video>
        </div>
    </div>
</body>
</html>
