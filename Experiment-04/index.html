<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment -04</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="container">

            <h1>Hotel Room Booking Form</h1>
            <form action="#" method="post">

                <label for="name" >Full Name:</label>
                <input name="Full Name" type="text" id="name" placeholder="Enter your name" required>
                <br><br>
            <label for="email">Email:</label>
            <input name="email" type="email" id="email" placeholder=""  required>
<br><br>
        <label for="phone">Phone:</label>
        <input name="Phone" type="text" id="phone" placeholder=""  required>
        <br><br>
        <label for="date1">Check-in-Date:</label>
        <input type="date" id="date1"  required>
        <br><br>
        <label for="date2">Check-out-date</label>
        <input type="date" id="date2"  required>
<br><br>
        <label for="type">Room Type:</label>
        <select name="" id="type">
            <option value="">Choose Room Type</option>
            <option value="single">Single</option>
            <option value="double">Double</option>
            <option value="triple">Triple</option>
        </select>
        
        <br><br>
        <label for="guest">Number of Guests:</label>
        <input type="number" id="guest" required>
        <br><br>
        <label for="req">Special Requests:</label>
        <textarea placeholder="Enter your Special Request" name="" id="req" cols="30" rows="5"></textarea>
        <br><br>
        <button type="submit" value="Book Now">Book Now</button>
        <button type="reset">Reset Form</button>
    </form>
    </div>
</div>
</body>
</html>
