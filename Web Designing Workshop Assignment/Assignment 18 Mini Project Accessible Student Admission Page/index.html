<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 18 Mini Project Accessible Student Admission Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 align="center">ABC College Admission 2026</h1>
            <h2>Courses and Fees</h2>
        <table cellpadding="4" cellspacing="2" border="1">
            <caption>Available Courses</caption>
            <tr style="background-color: lightsteelblue;">
                <th>Course</th>
                <th>Seats</th>
                <th>Fees</th>
            </tr>
            <tr>
                <td>B.Tech</td>
                <td>120</td>
                <td>&#8377;90,000</td>
            </tr>
            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>&#8377;45,000</td>
            </tr>
        </table>
        <fieldset>
            <legend>Application Form</legend>
            <label for="name">Name:</label>
            <input type="text">
            <br><br>
            <label for="email">Email:</label>
            <input type="email">
            <br><br>
            <label for="course">Course:</label>
            <select name="" id="course">
                <option value="">B.Tech CSE </option>
                <option value="">ECE</option>
                <option value="">AIML</option>
                <option value="">AIML DS</option>
                <option value="">Civil</option>
            </select>
            <br><br>
            <label for="feedback">Statement:</label>
            <br>
            <textarea rows="6" cols="50" name="" id="feedback"></textarea>
            <br>
            <button type="submit">Apply</button>
        </fieldset>
        
<div class="footer" align="center">&copy; 2026 ABC College</div>
        
    </div>
</body>
</html>
