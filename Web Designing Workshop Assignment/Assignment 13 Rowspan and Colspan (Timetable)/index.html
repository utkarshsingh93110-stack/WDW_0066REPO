<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 13 Rowspan and Colspan (Timetable)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table cellpadding="5" cellspacing="0" border="1" >
        <caption>Weekly Timeline</caption>
        <tr>
            <th>Day</th>
            <th>9-10</th>
            <th>10-11</th>
            <th>11-12</th>
        </tr>
        <tr>
            <td>Mon</td>
            <td>Maths</td>
            <td>HTML</td>
            <td rowspan="2">Web lab</td>
        </tr>
        <tr>
            <td>Tue</td>
            <td>DBMS</td>
            <td>OS</td>
        </tr>
        <tr>
            <td>Web</td>
            <td colspan="3" align="center">Seminar</td>
        </tr>
    </table>
</body>
</html>
