<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5 Unordered, Ordered and Description Lists</title>
</head>
<body>
    <div class="container">
        <h2>Unordered</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>Javascript</li>
        </ul>
        <h2>Ordered</h2>
        <ol type="A">
            <li>Install VS Code</li>
            <li>Create file</li>
            <li>Open in browser</li>
        </ol>
        <h2>Description</h2>
        <dl>
            <dt>HTML</dt>
            <dd>HyperText Markup Language</dd>
            <dt>CSS</dt>
            <dd>Cascading Style Sheet</dd>
        </dl>
    </div>
</body>
</html>
