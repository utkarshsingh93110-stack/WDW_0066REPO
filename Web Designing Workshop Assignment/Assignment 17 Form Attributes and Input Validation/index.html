<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 17: Form Attributes and Input Validation</title>
    <style>
        .form-box {
            border-top: 1px solid green;
            border-bottom: 1px solid green;
            padding: 20px 58px;
        }

        input {
            width: 230px;
            padding: 3px;
            margin-bottom: 18px;
            font-size: 16px;
        }

        input[type="number"] {
            width: 60px;
        }

        button {
            padding: 5px;
            font-size: 16px;
            cursor: pointer;
        }

       
    </style>
    </head>
<body>

    <div class="form-box">

        <form action="submit.php" method="POST">

            <input type="text"
                   name="fullname"
                   placeholder="Full name"
                   required>
            <br>

            <input type="email"
                   name="email"
                   placeholder="you@college.edu"
                   required>
            <br>

            <input type="tel"
                   name="mobile"
                   placeholder="10-digit mobile"
                   pattern="[0-9]{10}"
                   title="Enter exactly 10 digits"
                   required>
            <br>

            <input type="password"
                   name="password"
                   placeholder="Min 6 characters"
                   minlength="6"
                   required>
            <br>

            <input type="number"
                   name="age"
                   placeholder="Age(17)"
                   min="17"
                   max="30"
                   required>
            <br>

            <button type="submit">Register</button>

        </form>

    </div>
</body>
</html>
