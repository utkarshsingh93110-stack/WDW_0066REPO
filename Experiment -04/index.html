<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment -04</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="container">

            <h1>Hotel Room Booking Form</h1>
            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="">
            <br><br>
            <label for="email">Email:</label>
            <input type="text" id="email" placeholder="">
<br><br>
        <label for="phone">Phone:</label>
        <input type="text" id="phone" placeholder="">
        <br><br>
        <label for="date1">Check-in-Date:</label>
        <input type="date" id="date1">
        <br><br>
        <label for="date2">Check-out-date</label>
        <input type="date" id="date2">
<br><br>
        <label for="type">Room Type:</label>
        <select name="" id="type">
            <option value="">Single</option>
            <option value="">Double</option>
            <option value="">Triple</option>
        </select>
        
        <br><br>
        <label for="guest">Number of Guests:</label>
        <input type="number" id="guest">
        <br><br>
        <label for="req">Special Requests:</label>
        <textarea name="" id="req"></textarea>
        <br><br>
        <button>Book Now</button>
        <button>Reset Form</button>
    </div>
</div>
</body>
</html>
