<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment -05</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="conatiner">
        <h1 align="center">Student Registration Form</h1>
        <hr>
        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="Enter Your Full Name">
        <br><br>
        <label for="email">Email:</label>
<input type="text" id="email" placeholder="Enter Vaild email address">
<br><br>
<label for="pass">Password:</label>
<input type="text" id="pass" value="Password" placeholder="Enter Password" required>
<br><br>
<label for="gender">Gender:</label>
<input name="gender" id="Male" value="Male" type="radio" >Male 
<input name="gender" id="Female" type="radio" value="Female" >Female
<input name="gender" id="other" type="radio" value="Other" >Other
<br><br>
<label for="course">Course:</label>
<select name="" id="course" >
    <option value="">B.TECH</option>
    <option value="">ECE</option>
    <option value="">CIVIL</option>
    <option value="">MECHANICAL</option>
</select>
<br><br>
<label for="contact">Contact No:</label>
<input type="text" id="contact" placeholder="Enter Phone Number">
<br><br>
<main>
    <label for="address">Address:</label>
</main>
<textarea name="" id="address" rows="5" cols="30" placeholder="Enter Your Address"></textarea>
<br><br>
<button>Register</button>
<button>Clear</button>
<hr>
<p align="center">&copy; 2025 Student Registration Portal</p>
</div>
</body>
</html>
